<div class="rich_media_content js_underline_content defaultNoSetting" id="js_content" style="visibility: visible; opacity: 0; "><section><span leaf=""><span textstyle="" style="font-size: 14px">  夫天地者，万物之逆旅也；光阴者，百代之过客也。而浮生若梦，为欢几何？古人秉烛夜游，良有以也。况阳春召我以烟景，大块假我以文章。会桃花之芳园，序天伦之乐事。群季俊秀，皆为惠连；吾人咏歌，独惭康乐。幽赏未已，高谈转清。开琼筵以坐花，飞羽觞而醉月。不有佳咏，何伸雅怀？如诗不成，罚依金谷酒数。</span></span></section><section style="text-align: center" nodeleaf=""><img class="rich_pages wxw-img" data-aiimagesource="0" data-ratio="0.9431818127632141" data-src="https://mmbiz.qpic.cn/mmbiz_jpg/cIBqLYh6ScZ13nY5kuX28RSkWDicNc466429h7XvzcicUGMyDpElGX2U9kib1gCyjWcaibh0o73DV2Es7NIjLibWvtWm8EhKZ5j7siaXbUr1NCcs4/640?wx_fmt=jpeg" data-type="jpg" data-w="1320" type="block"/></section><section><span leaf=""><span textstyle="" style="font-size: 12px; color: #999999">古代文学课百无聊赖 ​被生活​暴击​之后</span></span></section><section><span leaf=""><span textstyle="" style="font-size: 12px; color: #999999">我说我治好了​自己的​​文青病 ​但为什么​看到​这首​序​还会​想哭</span></span></section><section><span leaf=""><span textstyle="" style="font-size: 12px; color: #999999">图源网络​ ​侵删</span></span></section><p style="display: none;"><mp-style-type data-value="10000"/></p></div>
